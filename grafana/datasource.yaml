# Grafana datasource provisioning. Installed by deploy/install-services.sh to
# /etc/grafana/provisioning/datasources/solarcontrol.yaml.
#
# The $INFLUX_TOKEN reference is resolved from grafana-server's environment,
# which install-services.sh sets via a systemd drop-in that reads
# /home/scott/solarcontrol/.env.
apiVersion: 1

datasources:
  - name: InfluxDB-solarcontrol
    uid: solarcontrol-influx
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: solarcontrol
      defaultBucket: solarcontrol
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUX_TOKEN
    editable: true
